services:
  # 1. MySQL 資料庫服務
  db:
    image: mysql:8.0
    container_name: shopee_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shopee_db
      MYSQL_USER: shopee_user
      MYSQL_PASSWORD: shopee_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. FastAPI 後端服務
  backend:
    build: ./backend
    container_name: shopee_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://shopee_user:shopee_password@db:3306/shopee_db
    depends_on:
      - db

  # 3. React 前端服務 (Nginx)
  frontend:
    build: ./frontend
    container_name: shopee_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: